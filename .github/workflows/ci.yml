name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog:
    name: Control catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate catalog and doc references
        run: python scripts/validate_controls.py
      - name: Control index is up to date
        run: |
          python scripts/build_index.py
          git diff --exit-code docs/control-index.md

  docs:
    name: Markdown lint and style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0
        with:
          globs: "**/*.md"
      - name: Dash and style check
        run: bash scripts/check-style.sh
      - name: Check relative links
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            while IFS= read -r link; do
              target="${link%%#*}"
              [ -z "$target" ] && continue
              if [ ! -e "$dir/$target" ]; then
                echo "Broken link in $file: $link"
                fail=1
              fi
            done < <(grep -oP '\]\(\K(?!https?://|mailto:|#)[^)]+' "$file" || true)
          done < <(find . -name '*.md' -not -path './node_modules/*' -not -path './.git/*' -not -path './.venv/*')
          exit $fail

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color .github/workflows/*.yml
